name: CI

# Self-hosted — Windows: win-x64-amd-9600x (win-x64-amd). Linux/macOS: linux-arm64 runners (linux-arm64 label).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SLNX: FastFsm.slnx
  CONFIGURATION: Release

jobs:
  build-test-smoke:
    name: build-test-smoke (${{ matrix.leg }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: windows-amd
            runs-on: [self-hosted, Windows, win-x64-amd]
          - leg: linux-arm64
            runs-on: [self-hosted, Linux, linux-arm64]
          - leg: macos-arm64
            runs-on: [self-hosted, macOS, linux-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.SLNX }}

      - name: Build
        run: dotnet build ${{ env.SLNX }} -c ${{ env.CONFIGURATION }} --no-restore -warnaserror

      - name: Test
        run: dotnet test ${{ env.SLNX }} -c ${{ env.CONFIGURATION }} --no-build --verbosity minimal

      - name: Pack and consumer smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/pack-and-smoke.ps1

      - name: Pack and consumer smoke (Unix)
        if: runner.os != 'Windows'
        run: bash ./scripts/pack-and-smoke.sh
